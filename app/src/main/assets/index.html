<body>
<header class="top"><div class="toprow"><div><div class="brand">Personal CFO</div><div class="sub" id="today"></div></div><button class="iconbtn" onclick="openSettings()">⚙️</button></div></header>
<main id="app" class="page"></main>
<button class="fab" onclick="openAdd()">＋</button>
<nav class="nav" aria-label="Primary navigation"><div class="navin"><button type="button" data-tab="home"><span>⌂</span>Home</button><button type="button" data-tab="history"><span>▤</span>History</button><button type="button" data-tab="accounts"><span>◉</span>Accounts</button><button type="button" data-tab="more"><span>☰</span>More</button></div></nav>
<div id="sheet" class="sheet" onclick="if(event.target===this)cancelForm()"><div class="sheetbox" id="sheetbox"></div></div><div id="toast" class="toast"></div>
<script>


const KEY='personal_cfo_mobile_v1';
let state=load(), tab='home';
function blank(){return{accounts:[{id:'cash',name:'Cash',type:'Cash',balance:0,openingBalance:0}],tx:[],assets:[],debts:[],budgets:[],recurring:[],tempMoney:[],commitments:[],safety:{reserve:0}}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(!x||!Array.isArray(x.accounts))return blank();delete x.goals;if(!Array.isArray(x.tx))x.tx=[];if(!Array.isArray(x.assets))x.assets=[];if(!Array.isArray(x.debts))x.debts=[];else x.debts.forEach(d=>{if(!Number.isFinite(+d.original)){d.original=+d.amount||0;delete d.amount;}if(!Number.isFinite(+d.paidAmount))d.paidAmount=0;if(!Number.isFinite(+d.remaining))d.remaining=Math.max(0,d.original-d.paidAmount);if(typeof d.note!=='string')d.note='';if(!Number.isFinite(+d.created))d.created=Date.now();if(!Array.isArray(d.payments))d.payments=[];});if(!Array.isArray(x.budgets))x.budgets=[];if(!Array.isArray(x.recurring))x.recurring=[];if(!Array.isArray(x.tempMoney))x.tempMoney=[];if(!Array.isArray(x.commitments))x.commitments=[];x.commitments.forEach(c=>{if(!Array.isArray(c.paymentIds))c.paymentIds=[];if(!Number.isFinite(+c.paidTotal))c.paidTotal=c.status==='settled'?(+c.amount||0):0});if(!x.safety||typeof x.safety!=='object')x.safety={reserve:0};if(!Number.isFinite(+x.safety.reserve))x.safety.reserve=0;if(Array.isArray(x.accounts)){x.accounts=x.accounts.filter(a=>a&&typeof a==='object');x.accounts.forEach((a,i)=>{if(!a.id)a.id='legacy_'+i+'_'+Date.now().toString(36);if(typeof a.name!=='string'||!a.name.trim())a.name='Account '+(i+1);if(!Number.isFinite(+a.balance))a.balance=0;if(!Number.isFinite(+a.openingBalance)){let linkedTx=x.tx.some(t=>t&& (t.accountId===a.id||t.fromAccountId===a.id||t.toAccountId===a.id));let recurring=x.recurring.some(r=>r&&r.accountId===a.id);let temp=x.tempMoney.some(t=>t&&t.accountId===a.id);let commitments=x.commitments.some(c=>c&&c.accountId===a.id);let debtPayments=x.debts.some(d=>Array.isArray(d.payments)&&d.payments.some(p=>p&&p.accountId===a.id));a.openingBalance=(linkedTx||recurring||temp||commitments||debtPayments)?null:(+a.balance||0)}if(!a.type)a.type='Other'});if(!x.accounts.length)x.accounts=blank().accounts;}delete x.safety.goal;return x}catch{return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return '৳ '+Number(n||0).toLocaleString('en-BD',{minimumFractionDigits:0,maximumFractionDigits:2})}
function date(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tempTotals(){let held=0,lent=0,borrowed=0;state.tempMoney.forEach(x=>{let rem=Math.max(0,+x.remaining||0);if(x.type==='holding')held+=rem;else if(x.type==='lent')lent+=rem;else if(x.type==='borrowed')borrowed+=rem});return{held,lent,borrowed}}
function totals(){let inc=0,exp=0;state.tx.forEach(t=>{if(t.type==='income')inc+=+t.amount;else if(t.type==='expense')exp+=+t.amount});let cash=state.accounts.reduce((a,x)=>a+(+x.balance||0),0);let assets=state.assets.reduce((a,x)=>a+(+x.amount||0),0), debt=state.debts.reduce((a,x)=>a+(+x.remaining||0),0),tm=tempTotals();let ownCash=Math.max(0,cash-tm.held-tm.borrowed);return{inc,exp,cash,ownCash,assets:assets+tm.lent,debt:debt+tm.held+tm.borrowed,net:cash+assets+tm.lent-debt-tm.held-tm.borrowed,held:tm.held,lent:tm.lent,borrowed:tm.borrowed}}
function render(){document.getElementById('today').textContent=new Date().toLocaleDateString('en-BD',{weekday:'short',day:'numeric',month:'short'});document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let el=document.getElementById('app');try{el.innerHTML=tab==='home'?home():tab==='history'?history():tab==='accounts'?accounts():more()}catch(e){console.error('Render error',e);el.innerHTML='<div class=\"card\"><b>Unable to open this section.</b><div class=\"muted\" style=\"margin-top:6px\">Your existing data was kept safe. Try reopening the section.</div></div>';toast('Section could not be opened');}}
function monthKey(d){return d.slice(0,7)}
function monthLabel(key){let [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-BD',{month:'long',year:'numeric'})}
function canonicalCategory(value){let raw=String(value||'').trim();if(!raw)return'Other';let n=raw.toLowerCase().replace(/[\s_-]+/g,'');const map={food:'Food',transport:'Transport',transportation:'Transport',shopping:'Shopping',groceries:'Food',grocery:'Food',bills:'Bills',utilities:'Bills',health:'Health',medical:'Health',education:'Education',entertainment:'Entertainment',salary:'Salary',other:'Other'};return map[n]||raw}
function categoryOptions(selected){const base=['Food','Transport','Shopping','Bills','Health','Education','Entertainment','Other'];let s=canonicalCategory(selected);if(s&&!base.includes(s))base.push(s);return base.map(c=>`<option value="${esc(c)}" ${c.toLowerCase()===s.toLowerCase()?'selected':''}>${esc(c)}</option>`).join('')}
function monthStats(key){let xs=state.tx.filter(x=>monthKey(x.date||'')===key);let inc=0,exp=0;const cats={};xs.forEach(x=>{let a=+x.amount||0;if(x.type==='income')inc+=a;else if(x.type==='expense'){exp+=a;let c=canonicalCategory(x.category);cats[c]=(cats[c]||0)+a}});return{inc,exp,saved:inc-exp,cats}}
function previousMonthKey(key){let [y,m]=key.split('-').map(Number);m--;if(m===0){m=12;y--}return `${y}-${String(m).padStart(2,'0')}`}
function pctChange(cur,prev){if(prev===0)return cur===0?0:null;return ((cur-prev)/prev)*100}
function deltaHtml(cur,prev){let d=pctChange(cur,prev);if(d===null)return '<div class="smartDelta muted">No previous data</div>';let sign=d>0?'+':'';return `<div class="smartDelta ${d>0?'expense':d<0?'income':'muted'}">${sign}${d.toFixed(1)}% vs last month</div>`}
function safeSpendStats(){
 let t=totals(), key=monthKey(date()), b=budgetStats(key);
 let budgetReserve=b.rows.reduce((a,r)=>a+Math.max(0,+r.remaining||0),0);
 let reserve=Math.max(0,+state.safety.reserve||0);
 let protectedTotal=budgetReserve+reserve;
 let shortfall=Math.max(0,protectedTotal-t.ownCash);
 let safe=Math.max(0,t.ownCash-protectedTotal);
 return{cash:t.cash,ownCash:t.ownCash,budgetReserve,reserve,protectedTotal,safe,shortfall,held:t.held,borrowed:t.borrowed};
}
function safeSpendCard(){
 let s=safeSpendStats();
 return `<div class="sectionTitle">Safe to spend</div><div class="safeCard"><div class="smallCaps">After current commitments</div><div class="safeAmount ${s.shortfall?'expense':'income'}">${money(s.safe)}</div><div class="muted">Liquid money you can spend without using the amounts you've protected.</div><div class="safeBreakdown"><div class="safeLine"><span>Liquid money</span><b>${money(s.cash)}</b></div><div class="safeLine"><span>Remaining budgets</span><b>− ${money(s.budgetReserve)}</b></div><div class="safeLine"><span>Protected reserve</span><b>− ${money(s.reserve)}</b></div></div>${s.shortfall?`<div class="safeWarn">⚠️ Protected amounts exceed your liquid money by ${money(s.shortfall)}.</div>`:''}<button class="btn secondary block" style="margin-top:12px" onclick="safeSpendPage()">View calculation</button></div>`;
}
function safeSpendPage(){
 let s=safeSpendStats();
 document.getElementById('app').innerHTML=`<h1>Safe to spend</h1><div class="safeCard"><div class="smallCaps">Available after protected amounts</div><div class="safeAmount ${s.shortfall?'expense':'income'}">${money(s.safe)}</div><div class="muted">This is a planning number, not a bank balance. It uses your current liquid money, remaining monthly budgets, protected reserve.</div><div class="safeBreakdown"><div class="safeLine"><span>Liquid money</span><b>${money(s.cash)}</b></div><div class="safeLine"><span>Remaining budgets</span><b>− ${money(s.budgetReserve)}</b></div><div class="safeLine"><span>Protected reserve</span><b>− ${money(s.reserve)}</b></div><div class="safeLine" style="padding-top:10px;margin-top:5px;border-top:1px solid var(--line)"><span><b>Protected total</b></span><b>${money(s.protectedTotal)}</b></div></div>${s.shortfall?`<div class="safeWarn">⚠️ You are short by ${money(s.shortfall)} versus the amounts you've protected.</div>`:''}</div><div class="sectionTitle">Protection settings</div><div class="card"><div class="row"><div><b>Emergency reserve</b><div class="muted">Money you want to keep untouched.</div></div><b>${money(s.reserve)}</b></div><button class="btn block" style="margin-top:14px" onclick="safeSpendForm()">Set protected amounts</button></div><div class="muted" style="margin-top:12px">Budget commitments are calculated from the current month's remaining category budgets. Transactions are never changed.</div>`;
}
function safeSpendForm(){
 let s=state.safety||{reserve:0};

function accountHasActivity(aid){

 let commitmentList=Array.isArray(state&&state.commitments)?state.commitments:[];
 let debtList=Array.isArray(state&&state.debts)?state.debts:[];
 let linkedTx=txs.some(t=>t&& (t.accountId===aid||t.fromAccountId===aid||t.toAccountId===aid));
 let recurring=recurringList.some(r=>r.accountId===aid);

 let commitments=commitmentList.some(c=>c.accountId===aid);

}

 let rows=active.map(x=>{let label=x.type==='holding'?'🟦 Holding':x.type==='lent'?'🟨 Lent out':'🟥 Borrowed';let sub=x.type==='holding'?`Held for ${esc(x.person||'someone')}`:x.type==='lent'?`Owed by ${esc(x.person||'someone')}`:`Owed to ${esc(x.person||'someone')}`;let due=x.dueDate?` · Due ${esc(x.dueDate)}`:'';return `<div class="card" style="margin-bottom:10px"><div class="row"><div><b>${label}</b><div class="muted">${sub}${due}</div><div class="muted">${esc(x.purpose||'No purpose added')}</div></div><strong>${money(x.remaining)}</strong></div><div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="settleTemp('${x.id}')">Settle</button><button class="btn secondary" onclick="editTemp('${x.id}')">Edit</button><button class="btn danger" onclick="deleteTemp('${x.id}')">Delete</button></div></div>`}).join('');
 document.getElementById('app').innerHTML=`<h1>Temporary Money</h1><div class="card"><div class="muted">Money that is temporarily outside your normal spending ownership.</div><div class="smartGrid" style="margin-top:12px"><div class="smartCard"><div class="muted">Held for others</div><div class="smartValue">${money(tm.held)}</div></div><div class="smartCard"><div class="muted">Lent out</div><div class="smartValue">${money(tm.lent)}</div></div><div class="smartCard"><div class="muted">Borrowed</div><div class="smartValue expense">${money(tm.borrowed)}</div></div><div class="smartCard"><div class="muted">Active items</div><div class="smartValue">${active.length}</div></div></div></div><button class="btn block" onclick="tempForm()">+ Add temporary money</button><div class="sectionTitle">Active temporary money</div>${rows||`<div class="card"><div class="empty">No temporary money yet.</div></div>`}`;
}
function tempForm(rid){let r=state.tempMoney.find(x=>x.id===rid),opts=state.accounts.map(a=>`<option value="${a.id}" ${r&&r.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('');openSheet(`<div class="handle"></div><h2>${r?'Edit':'Add'} temporary money</h2><div class="field"><label>Type</label><select id="tmtype"><option value="holding" ${!r||r.type==='holding'?'selected':''}>Holding — someone else's money is with me</option><option value="lent" ${r&&r.type==='lent'?'selected':''}>Lent — my money is with someone else</option><option value="borrowed" ${r&&r.type==='borrowed'?'selected':''}>Borrowed — someone else's money is with me</option></select></div><div class="field"><label>Amount</label><input id="tmamount" type="number" inputmode="decimal" min="0.01" step="0.01" value="${r?r.original||r.remaining:''}" placeholder="0"></div><div class="field"><label>Person / owner</label><input id="tmperson" value="${r?esc(r.person||''):''}" placeholder="Arif, Friend, Family..."></div><div class="field"><label>Purpose</label><input id="tmpurpose" value="${r?esc(r.purpose||''):''}" placeholder="Optional"></div><div class="field"><label>Account</label><select id="tmacc">${opts}</select></div><div class="field"><label>Due date (optional)</label><input id="tmdate" type="date" value="${r?esc(r.dueDate||''):''}"></div><div class="actions"><button class="btn secondary" onclick="cancelForm()">Cancel</button><button class="btn" onclick="saveTemp('${rid||''}')">${r?'Save changes':'Save temporary money'}</button></div>`);bindDirtyTracking()}
function saveTemp(rid){let type=document.getElementById('tmtype').value,amount=+document.getElementById('tmamount').value,person=document.getElementById('tmperson').value.trim(),purpose=document.getElementById('tmpurpose').value.trim(),accountId=document.getElementById('tmacc').value,dueDate=document.getElementById('tmdate').value;if(!(amount>0)){toast('Enter an amount greater than 0');return}if(!state.accounts.find(a=>a.id===accountId)){toast('Select an account');return}if(rid){let old=state.tempMoney.find(x=>x.id===rid);if(!old)return;toast('For active items, delete and add again to change type or account');return}let acc=state.accounts.find(a=>a.id===accountId);if(type==='holding'||type==='borrowed')acc.balance+=amount;else acc.balance-=amount;state.tempMoney.push({id:id(),type,original:amount,remaining:amount,person,purpose,accountId,dueDate,created:Date.now()});save();closeSheet(true);temporaryMoneyPage();toast('Temporary money added')}
function settleTemp(idv){let x=state.tempMoney.find(x=>x.id===idv);if(!x)return;let amount=Math.max(0,+x.remaining||0);let raw=prompt(`How much do you want to settle? Outstanding: ${amount}` ,String(amount));if(raw===null)return;let part=+raw;if(!(part>0)||part>amount){toast('Enter a valid settlement amount');return}let acc=state.accounts.find(a=>a.id===x.accountId);if(!acc){toast('Account no longer exists');return}if(x.type==='holding'||x.type==='borrowed')acc.balance-=part;else acc.balance+=part;x.remaining=+(amount-part).toFixed(2);if(x.remaining<=0)state.tempMoney=state.tempMoney.filter(y=>y.id!==idv);save();temporaryMoneyPage();toast(x.remaining>0?'Partial settlement recorded':'Temporary money settled')}
function editTemp(idv){toast('Active temporary money keeps its original account and type. Settle it or delete it before recreating it.');}
function deleteTemp(idv){let x=state.tempMoney.find(x=>x.id===idv);if(!x)return;if(!confirm(`Delete this temporary money item? Its current balance will also be reversed.`))return;let acc=state.accounts.find(a=>a.id===x.accountId);let rem=+x.remaining||0;if(acc){if(x.type==='holding'||x.type==='borrowed')acc.balance-=rem;else acc.balance+=rem}state.tempMoney=state.tempMoney.filter(y=>y.id!==idv);save();temporaryMoneyPage();toast('Temporary money deleted')}

function commitmentPaid(x){
 if(Array.isArray(x.paymentIds)&&x.paymentIds.length){
   return Math.max(0,Math.min(+x.amount||0,x.paymentIds.reduce((sum,pid)=>{let t=state.tx.find(t=>t.id===pid&&t.type==='expense'&&t.commitmentId===x.id);return sum+(t?+t.amount:0)},0)));
 }
 return Math.max(0,Math.min(+x.amount||0,Number.isFinite(+x.paidTotal)?+x.paidTotal:0));
}
function commitmentRemaining(x){return Math.max(0,(+x.amount||0)-commitmentPaid(x))}
function syncCommitment(x){
 let paid=commitmentPaid(x);x.paidTotal=+paid.toFixed(2);
 if(!Array.isArray(x.paymentIds))x.paymentIds=[];
 x.paymentIds=x.paymentIds.filter(pid=>state.tx.some(t=>t.id===pid&&t.commitmentId===x.id));
 x.status=paid<=0?'active':paid+0.005>=(+x.amount||0)?'settled':'partial';
 if(x.status==='settled'&&!x.settledAt)x.settledAt=Date.now();
 if(x.status!=='settled')delete x.settledAt;
 return x;
}
function commitmentStatusText(x,today){
 let remaining=commitmentRemaining(x);if(remaining<=0)return '🟢 Settled';
 let d=new Date((x.dueDate||'2099-12-31')+'T00:00:00');let days=Math.ceil((d-today)/86400000);
 return days<0?'🔴 Overdue':days===0?'🟠 Due today':days<=7?'🟡 Due soon':'🟢 Upcoming';
}
function commitmentRow(x,today){
 syncCommitment(x);let remaining=commitmentRemaining(x),paid=commitmentPaid(x),status=commitmentStatusText(x,today);
 let paymentLabel=paid>0?`Paid ${money(paid)} · Remaining ${money(remaining)}`:`Remaining ${money(remaining)}`;
 return `<div class="card" style="margin-bottom:10px"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category||'Other')} · Due ${esc(x.dueDate)} · ${status}</div><div class="muted" style="margin-top:4px">${paymentLabel}</div>${x.note?`<div class="muted" style="margin-top:4px">${esc(x.note)}</div>`:''}</div><b class="expense">−${money(x.amount)}</b></div>${remaining>0?`<button class="btn block" style="margin-top:12px" onclick="commitmentPayForm('${x.id}')">＋ Record payment</button>`:`<div class="muted" style="margin-top:12px">Fully paid. Linked payment${(x.paymentIds||[]).length===1?'':'s'}: ${(x.paymentIds||[]).length}</div>`}<div class="actions"><button class="btn danger" onclick="deleteCommitment('${x.id}')">Delete</button></div></div>`;
}
function commitmentPage(){
 let today=new Date(); today.setHours(0,0,0,0);
 state.commitments.forEach(syncCommitment);
 let active=state.commitments.filter(x=>x.status!=='settled');
 let settled=state.commitments.filter(x=>x.status==='settled').sort((a,b)=>(b.settledAt||0)-(a.settledAt||0)).slice(0,10);
 let total=active.reduce((a,x)=>a+commitmentRemaining(x),0);
 let soon=active.filter(x=>{let d=new Date((x.dueDate||'2099-12-31')+'T00:00:00');let days=Math.ceil((d-today)/86400000);return days>=0&&days<=7}).reduce((a,x)=>a+commitmentRemaining(x),0);
 let rows=active.sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))).map(x=>commitmentRow(x,today)).join('');
 let settledRows=settled.map(x=>commitmentRow(x,today)).join('');
 document.getElementById('app').innerHTML=`<h1>Financial Commitments</h1><div class="card"><div class="muted">Money you have committed to spend. Payments are recorded separately and linked to the commitment.</div><div class="smartGrid" style="margin-top:12px"><div class="smartCard"><div class="muted">Remaining</div><div class="smartValue expense">${money(total)}</div></div><div class="smartCard"><div class="muted">Due in 7 days</div><div class="smartValue expense">${money(soon)}</div></div><div class="smartCard"><div class="muted">Active items</div><div class="smartValue">${active.length}</div></div></div></div><button class="btn block" onclick="commitmentForm()">＋ Add commitment</button><div class="sectionTitle">Active commitments</div>${rows||`<div class="card"><div class="empty">No active commitments.</div></div>`}${settledRows?`<div class="sectionTitle">Recently settled</div>${settledRows}`:''}<div class="sectionTitle">Accounting rule</div><div class="card"><div class="muted">Creating a commitment does not change balances. Only an actual recorded payment changes the account balance, expense total and budget. Partial payments remain linked until the commitment is fully paid.</div></div>`;
}
function commitmentForm(){
 let accounts=state.accounts.filter(a=>a.isActive!==false);
 openSheet(`<div class="handle"></div><h2>Add commitment</h2><div class="field"><label>Name</label><input id="cn" placeholder="e.g. University fee" required></div><div class="field"><label>Total amount</label><input id="ca" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div class="field"><label>Due date</label><input id="cd" type="date" required></div><div class="field"><label>Category</label><select id="ccat">${categoryOptions('Other')}</select></div><div class="field"><label>Preferred account</label><select id="cacc">${accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name||'Account')}</option>`).join('')}</select></div><div class="field"><label>Note</label><input id="cno" placeholder="Optional"></div><div class="actions"><button class="btn secondary" onclick="cancelForm()">Cancel</button><button class="btn" onclick="saveCommitment()">Save commitment</button></div>`);
 bindDirtyTracking();
}
function saveCommitment(){let name=document.getElementById('cn').value.trim(),amount=+document.getElementById('ca').value,dueDate=document.getElementById('cd').value,category=canonicalCategory(document.getElementById('ccat').value),accountId=document.getElementById('cacc').value,note=document.getElementById('cno').value.trim();if(!name){toast('Enter a name');return}if(!(amount>0)){toast('Enter a valid amount');return}if(!dueDate){toast('Choose a due date');return}if(!accountId){toast('Select an account');return}state.commitments.push({id:id(),name,amount,dueDate,category,accountId,note,status:'active',paidTotal:0,paymentIds:[],created:Date.now()});save();closeSheet(true);commitmentPage();toast('Commitment added')}
function commitmentPayForm(cid){
 let x=state.commitments.find(x=>x.id===cid);if(!x)return;syncCommitment(x);let remaining=commitmentRemaining(x);if(remaining<=0){toast('This commitment is already fully paid');return}
 let opts=state.accounts.filter(a=>a.isActive!==false).map(a=>`<option value="${esc(a.id)}" ${a.id===x.accountId?'selected':''}>${esc(a.name||'Account')}</option>`).join('');
 openSheet(`<div class="handle"></div><h2>Record payment</h2><div class="card"><div class="muted">${esc(x.name)}</div><div style="font-size:24px;font-weight:850;margin-top:4px">${money(remaining)} remaining</div><div class="muted" style="margin-top:4px">Total ${money(x.amount)} · Already paid ${money(commitmentPaid(x))}</div></div><div class="field"><label>Payment amount</label><input id="cpa" type="number" inputmode="decimal" min="0.01" max="${remaining}" step="0.01" value="${remaining}" required></div><div class="field"><label>Actual payment account</label><select id="cpacc">${opts}</select></div><div class="field"><label>Payment date</label><input id="cpdate" type="date" value="${date()}"></div><div class="field"><label>Category</label><select id="cpcat">${categoryOptions(x.category||'Other')}</select></div><div class="field"><label>Note</label><input id="cpnote" value="${esc(x.note||x.name)}" placeholder="Optional"></div><div class="muted">This creates a linked expense and updates the selected account balance. Your commitment stays open if the payment is partial.</div><div class="actions"><button class="btn secondary" onclick="cancelForm()">Cancel</button><button class="btn" onclick="recordCommitmentPayment('${x.id}')">Confirm payment</button></div>`);
 bindDirtyTracking();
}
function recordCommitmentPayment(cid){
 let x=state.commitments.find(x=>x.id===cid);if(!x)return;syncCommitment(x);let remaining=commitmentRemaining(x),amount=+document.getElementById('cpa').value,accountId=document.getElementById('cpacc').value,payDate=document.getElementById('cpdate').value,category=canonicalCategory(document.getElementById('cpcat').value),note=document.getElementById('cpnote').value.trim();
 if(!(amount>0)||amount>remaining+0.005){toast('Enter a valid payment amount');return}let acc=state.accounts.find(a=>a.id===accountId);if(!acc){toast('Select a valid account');return}if(!payDate){toast('Choose a payment date');return}
 if(!confirm(`Record ${money(amount)} payment for ${x.name}?\nAccount: ${acc.name}`))return;
 acc.balance-=amount;let tid=id();state.tx.push({id:tid,type:'expense',amount:+amount.toFixed(2),category,date:payDate,note:note||x.name,accountId:acc.id,commitmentId:x.id,created:Date.now()});if(!Array.isArray(x.paymentIds))x.paymentIds=[];x.paymentIds.push(tid);x.paidTotal=+(commitmentPaid(x)+amount).toFixed(2);syncCommitment(x);save();closeSheet(true);commitmentPage();toast(x.status==='settled'?'Commitment fully paid':'Partial payment recorded')
}
function editCommitmentPayment(tid){
 let tx=state.tx.find(t=>t.id===tid&&t.commitmentId);if(!tx)return;let x=state.commitments.find(c=>c.id===tx.commitmentId);if(!x){toast('Linked commitment no longer exists');return}let opts=state.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===tx.accountId?'selected':''}>${esc(a.name)}</option>`).join('');
 openSheet(`<div class="handle"></div><h2>Edit payment</h2><div class="card"><div class="muted">Linked to</div><b>${esc(x.name)}</b><div class="muted" style="margin-top:4px">Total commitment ${money(x.amount)}</div></div><div class="field"><label>Payment amount</label><input id="epta" type="number" inputmode="decimal" min="0.01" step="0.01" value="${tx.amount}"></div><div class="field"><label>Payment date</label><input id="eptd" type="date" value="${esc(tx.date)}"></div><div class="field"><label>Actual payment account</label><select id="eptacc">${opts}</select></div><div class="field"><label>Category</label><select id="eptcat">${categoryOptions(tx.category||x.category||'Other')}</select></div><div class="field"><label>Note</label><input id="eptnote" value="${esc(tx.note||x.name)}"></div><div class="muted">The commitment's paid total will be recalculated from its linked payments.</div><div class="actions"><button class="btn secondary" onclick="cancelForm()">Cancel</button><button class="btn" onclick="updateCommitmentPayment('${tx.id}')">Save payment</button></div>`);bindDirtyTracking();
}
function updateCommitmentPayment(tid){
 let tx=state.tx.find(t=>t.id===tid&&t.commitmentId);if(!tx)return;let x=state.commitments.find(c=>c.id===tx.commitmentId);if(!x)return;let amount=+document.getElementById('epta').value,dateV=document.getElementById('eptd').value,accountId=document.getElementById('eptacc').value,category=canonicalCategory(document.getElementById('eptcat').value),note=document.getElementById('eptnote').value.trim();if(!(amount>0)||!dateV){toast('Enter valid payment details');return}let otherPaid=commitmentPaid(x)-(+tx.amount||0);if(amount>Math.max(0,(+x.amount||0)-otherPaid)+0.005){toast('Payment is larger than the commitment remaining');return}let oldAcc=state.accounts.find(a=>a.id===tx.accountId),newAcc=state.accounts.find(a=>a.id===accountId);if(!newAcc){toast('Select a valid account');return}if(!confirm('Save this payment change?'))return;if(oldAcc)oldAcc.balance+=+tx.amount||0;newAcc.balance-=amount;Object.assign(tx,{amount:+amount.toFixed(2),date:dateV,accountId:newAcc.id,category,note:note||x.name});syncCommitment(x);save();closeSheet(true);commitmentPage();toast('Payment updated')
}
function deleteCommitment(cid){let x=state.commitments.find(x=>x.id===cid);if(!x)return;syncCommitment(x);if((x.paymentIds||[]).length){toast('Reverse linked payments before deleting this commitment');return}if(!confirm('Delete this commitment?'))return;state.commitments=state.commitments.filter(x=>x.id!==cid);save();commitmentPage();toast('Commitment deleted')}

><b>🛡️ Safe to Spend</b><span class="muted">Protected money and available spending</span></div><span>›</span></button><button class="moreItem" onclick="assetsPage()"><div><b>💎 Assets</b><span class="muted">Track valuable assets</span></div><span>›</span></button><button class="moreItem" onclick="debtPage()"><div><b>💳 Debt</b><span class="muted">Track outstanding liabilities</span></div><span>›</span></button></div><div class="sectionTitle">App</div><div class="card" style="padding:6px"><button class="moreItem" onclick="openSettings()"><div><b>⚙️ Settings</b><span class="muted">Backup, restore and data controls</span></div><span>›</span></button></div>`}
function go(x){if(x==='recurring'){tab='more';recurringPage();return false}if(x==='assets'){tab='more';assetsPage();return false}if(x==='debt'){tab='more';debtPage();return false}if(x==='budget'){tab='more';budgetPage();return false}if(x==='safe'){tab='more';safeSpendPage();return false}if(!['home','history','accounts','more'].includes(x))x='home';tab=x;render();return false}
function openAdd(prefill){
 let opts=state.accounts.map(a=>`<option value="${a.id}" ${prefill&&prefill.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
 let p=prefill||{};
 openSheet(`<div class="handle"></div><h2>${p.id?'Repeat transaction':'Quick add transaction'}</h2>
 <div class="seg"><button id="ti" class="${p.type==='expense'?'':'active'}" onclick="setType('income')">Income</button><button id="te" class="${p.type==='expense'?'active':''}" onclick="setType('expense')">Expense</button></div>
 <div class="field"><label>Quick entry</label><input id="quick" value="" placeholder="Example: 250 Food or 250 transport" oninput="previewQuickEntry()"><div id="quickHint" class="muted" style="margin-top:5px">Type an amount and category to fill the fields below.</div></div>
 <div class="field"><label>Amount</label><input id="amt" type="number" inputmode="decimal" min="0.01" step="0.01" value="${p.amount||''}" placeholder="0" autofocus></div>
 <div class="field"><label>Category</label><select id="cat">${categoryOptions(p.category||'Other')}</select></div>
 <div class="field"><label>Date</label><input id="dt" type="date" value="${p.date||date()}"></div>
 <div class="field"><label>Account</label><select id="acc">${opts}</select></div>
 <div class="field"><label>Note</label><input id="note" value="${esc(p.note||'')}" placeholder="Optional"></div>
 <div class="actions"><button class="btn secondary" onclick="cancelForm()">Cancel</button><button class="btn" onclick="addTx()">Save</button></div>`);
 window._type=p.type||'income'; window._editingId=null; window._quickPrefill=p;
 bindDirtyTracking();
}
function previewQuickEntry(){
 let raw=(document.getElementById('quick')?.value||'').trim(); if(!raw)return;
 let m=raw.match(/^(?:৳|tk\s*)?\s*(\d+(?:\.\d+)?)\s+(.+)$/i); if(!m)m=raw.match(/^(.+?)\s+(?:৳|tk)?\s*(\d+(?:\.\d+)?)$/i);
 if(!m){document.getElementById('quickHint').textContent='Try: 250 Food, 250 transport, or Salary 20000';return}
 let amount=m[1]; let label=m[2];
 if(!/^\d/.test(m[1])){label=m[1];amount=m[2]}
 let cat=canonicalCategory(label); let known=['Food','Transport','Shopping','Bills','Health','Education','Entertainment','Other'];
 let lower=label.toLowerCase(); let matched=known.find(c=>lower===c.toLowerCase()||lower.includes(c.toLowerCase()));
 if(matched)cat=matched; else if(lower.includes('salary')||lower.includes('income')||lower.includes('pay')){window._type='income';document.getElementById('ti').classList.add('active');document.getElementById('te').classList.remove('active');cat='Other'}
 document.getElementById('amt').value=amount; document.getElementById('cat').value=cat;
 if(document.getElementById('note').value.trim()==='') document.getElementById('note').value=label;
 document.getElementById('quickHint').textContent=`Ready: ${money(+amount)} · ${cat}`;
}
function setType(t){window._type=t;document.getElementById('ti').classList.toggle('active',t==='income');document.getElementById('te').classList.toggle('active',t==='expense')}
function addTx(){
 let amount=+document.getElementById('amt').value;
 if(!(amount>0)){toast('Enter an amount greater than 0');return}
 let acc=state.accounts.find(a=>a.id===document.getElementById('acc').value);
 if(!acc){toast('Select an account');return}
 let type=window._type;
 acc.balance += type==='income'?amount:-amount;
 state.tx.push({id:id(),type,amount,category:canonicalCategory(document.getElementById('cat').value),date:document.getElementById('dt').value,note:document.getElementById('note').value.trim(),accountId:acc.id,created:Date.now()});
 save();closeSheet(true);toast(type==='income'?'Income added':'Expense added')
}
function openTx(tid){
 let x=state.tx.find(t=>t.id===tid); if(!x)return;
 if(x.type==='transfer'){

function isoDate(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}

function isoAddDays(ds,n){let d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

function projectedBalanceForDate(targetDate){
  const today=date();
  const target=String(targetDate||today);
  let balance=totals().cash;
  if(target<=today)return balance;
  const occurrences=recurringOccurrencesBetween(today,target);
  occurrences.forEach(x=>{
    const amount=+x.amount||0;
    balance += x.type==='income' ? amount : -amount;
  });
  return balance;
}
function projectedCashBreakdown(targetDate){

  if(target<=today)return {starting,income:0,expense:0,net:0,projected:starting,count:0};
  const occurrences=recurringOccurrencesBetween(today,target);
  let income=0,expense=0;
  occurrences.forEach(x=>{const amount=+x.amount||0;if(x.type==='income')income+=amount;else expense+=amount});

function healthScoreData(){

 let recent=[], kk=key, monthsWithData=0, txRecent=0;
 for(let i=0;i<3;i++){let mm=monthStats(kk);recent.push(mm);if(mm.inc||mm.exp)monthsWithData++;txRecent+=state.tx.filter(x=>monthKey(x.date||'')===kk).length;kk=previousMonthKey(kk)}
 let avgExp=recent.reduce((a,x)=>a+x.exp,0)/3;
 let metrics=[];
 let rate=m.inc>0?(m.saved/m.inc)*100:null;
 if(rate!==null){let sc=rate>=30?100:rate>=20?90:rate>=10?75:rate>=0?60:rate>=-10?40:rate>=-30?15:0;metrics.push(healthMetricScore('Cash flow',sc,25,`Savings rate is ${rate.toFixed(1)}% this month.`,rate>=0?'On track':'Needs attention',rate>=0?'good':'bad'))}
 let coverage=avgExp>0?t.ownCash/avgExp:null;
 if(coverage!==null){let sc=coverage>=6?100:coverage>=3?90:coverage>=2?75:coverage>=1?55:coverage>=0.5?30:0;metrics.push(healthMetricScore('Liquidity',sc,20,`${coverage.toFixed(1)} months of recent expense coverage from own liquid money.`,coverage>=2?'Strong':coverage>=1?'Watch':'Needs attention',coverage>=2?'good':'bad'))}
 let debtBase=t.cash+t.assets+t.lent, debtRatio=debtBase>0?(t.debt/debtBase)*100:null;
 if(debtRatio!==null){let sc=debtRatio<=10?100:debtRatio<=30?85:debtRatio<=50?70:debtRatio<=80?50:debtRatio<=100?30:0;metrics.push(healthMetricScore('Debt',sc,15,`Debt is ${debtRatio.toFixed(1)}% of cash plus assets.`,debtRatio<=30?'Low':debtRatio<=80?'Watch':'High',debtRatio<=30?'good':'bad'))}
 let st=budgetStats(key), budgetUtil=st.totalBudget>0?(st.totalSpent/st.totalBudget)*100:null;
 if(budgetUtil!==null){let sc=budgetUtil<=70?100:budgetUtil<=85?90:budgetUtil<=100?75:budgetUtil<=120?40:0;metrics.push(healthMetricScore('Budget control',sc,15,`${budgetUtil.toFixed(1)}% of current monthly budgets are used.`,budgetUtil<=100?'On track':'Over budget',budgetUtil<=100?'good':'bad'))}
 let reserve=Math.max(0,+state.safety.reserve||0), reserveCoverage=avgExp>0?reserve/avgExp:null;
 if(reserve>0&&reserveCoverage!==null){let sc=reserveCoverage>=6?100:reserveCoverage>=3?90:reserveCoverage>=2?70:reserveCoverage>=1?45:20;metrics.push(healthMetricScore('Emergency reserve',sc,15,`${reserveCoverage.toFixed(1)} months of recent expenses are protected.`,reserveCoverage>=3?'Strong':reserveCoverage>=1?'Watch':'Low',reserveCoverage>=3?'good':'bad'))}
 let today=new Date();today.setHours(0,0,0,0);let due30=state.commitments.filter(c=>c.status!=='settled').reduce((sum,c)=>{let d=new Date((c.dueDate||'2099-12-31')+'T00:00:00'),days=Math.ceil((d-today)/86400000);return days>=0&&days<=30?sum+commitmentRemaining(c):sum},0);
 if(due30>0){let base=Math.max(1,t.ownCash),ratio=due30/base,sc=ratio<=0.25?100:ratio<=0.5?80:ratio<=0.75?60:ratio<=1?35:0;metrics.push(healthMetricScore('Commitment pressure',sc,10,`${money(due30)} is due within 30 days, equal to ${(ratio*100).toFixed(0)}% of own liquid money.`,ratio<=0.5?'Low':'Watch',ratio<=0.5?'good':'bad'))}
 let totalWeight=metrics.reduce((a,x)=>a+x.weight,0), score=totalWeight?Math.round(metrics.reduce((a,x)=>a+x.score*x.weight,0)/totalWeight):null;
 let confidence=txRecent>=15&&monthsWithData>=2?'High':txRecent>=5||monthsWithData>=2?'Medium':'Low';
 return{score,metrics,confidence,txRecent,monthsWithData,rate,avgExp,coverage,reserveCoverage,budgetUtil,due30,ownCash:t.ownCash};
}

function runMoneySimulation(){

function saveDebt(debtId){
    let name = document.getElementById('dn').value.trim();
    let original = +document.getElementById('da').value;
    let note = document.getElementById('dnote').value.trim();
    if(!name) { toast('Enter a debt name'); return; }
    if(!Number.isFinite(original) || original < 0) { toast('Enter a valid original amount of 0 or more'); return; }
    
    if(debtId){
        let d = state.debts.find(x=>x.id===debtId);
        if(!d) return;
        if(original < d.paidAmount) {
            toast('Original amount cannot be less than already paid amount (' + money(d.paidAmount) + ')');
            return;
        }
        d.name = name;
        d.original = +original.toFixed(2);
        d.note = note;
        d.remaining = +Math.max(0, d.original - d.paidAmount).toFixed(2);
        save();
        closeSheet(true);
        debtDetail(debtId);
        toast('Debt updated');
    } else {
        let newDebt = {
            id: id(),
            name,
            original: +original.toFixed(2),
            paidAmount: 0,
            remaining: +original.toFixed(2),
            note,
            created: Date.now(),
            payments: []
        };
        state.debts.push(newDebt);
        save();
        closeSheet(true);
        debtPage();
        toast('Debt added');
    }
}

            <input id="dpa" type="number" min="0.01" max="${d.remaining}" step="0.01" inputmode="decimal" value="${d.remaining}" required>
        </div>
        <div class="field">
            <label>Payment date</label>
            <input id="dpdate" type="date" value="${date()}" required>
        </div>
        <div class="field">
            <label>Paid from account</label>
            <select id="dpacc">${opts}</select>
        </div>
        <div class="field">
            <label>Note (optional)</label>
            <input id="dpnote" placeholder="Optional payment note">
        </div>
        <div class="muted">Principal repayment decreases your account balance and debt remaining. It does not affect normal expenses or budget spending.</div>
        <div class="actions">
            <button class="btn secondary" onclick="cancelForm()">Cancel</button>
            <button class="btn" onclick="recordDebtPayment('${d.id}')">Confirm payment</button>
        </div>
    `);
    bindDirtyTracking();
}

function recordDebtPayment(debtId){
    let d = state.debts.find(x=>x.id===debtId);
    if(!d) return;
    let amount = +document.getElementById('dpa').value;
    let payDate = document.getElementById('dpdate').value;
    let accountId = document.getElementById('dpacc').value;
    let note = document.getElementById('dpnote').value.trim();

    if(!(amount > 0)) { toast('Enter a valid amount greater than 0'); return; }
    if(amount > d.remaining + 0.005) { toast('Payment cannot exceed remaining debt (' + money(d.remaining) + ')'); return; }
    let acc = state.accounts.find(a=>a.id===accountId);
    if(!acc) { toast('Select a valid account'); return; }
    if(!payDate) { toast('Choose a valid payment date'); return; }

    amount = +amount.toFixed(2);
    acc.balance = +(acc.balance - amount).toFixed(2);

    let tid = id();
    let txObj = {
        id: tid,
        type: 'debt_payment',
        amount,
        category: 'Debt Repayment',
        date: payDate,
        note: note || ('Payment to ' + d.name),
        accountId: acc.id,
        debtId: d.id,
        created: Date.now()
    };
    state.tx.push(txObj);

    let pid = id();
    let paymentObj = {
        id: pid,
        amount,
        date: payDate,
        accountId: acc.id,
        note,
        transactionId: tid
    };
    if(!Array.isArray(d.payments)) d.payments = [];
    d.payments.push(paymentObj);

    d.paidAmount = +(d.paidAmount + amount).toFixed(2);
    d.remaining = +Math.max(0, d.original - d.paidAmount).toFixed(2);

    save();
    closeSheet(true);
    debtDetail(d.id);
    toast('Payment of ' + money(amount) + ' recorded');
}

function debtPaymentEditForm(debtId, paymentId){
    let d = state.debts.find(x=>x.id===debtId);
    if(!d) return;
    let p = d.payments.find(x=>x.id===paymentId);
    if(!p) return;
    let accounts = state.accounts.filter(a=>a.isActive!==false);
    let opts = accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===p.accountId?'selected':''}>${esc(a.name)}</option>`).join('');

    openSheet(`
        <div class="handle"></div>
        <h2>Edit debt payment</h2>
        <div class="field">
            <label>Payment amount</label>

        </div>
        <div class="field">
            <label>Payment date</label>
            <input id="edpdate" type="date" value="${esc(p.date)}" required>
        </div>
        <div class="field">
            <label>Account</label>

        </div>

            <label>Note</label>

        </div>
        <div class="actions">
            <button class="btn secondary" onclick="cancelForm()">Cancel</button>
            <button class="btn" onclick="saveDebtPaymentEdit('${d.id}','${p.id}')">Save changes</button>
        </div>
    `);
    bindDirtyTracking();
}

function saveDebtPaymentEdit(debtId, paymentId){
    let d = state.debts.find(x=>x.id===debtId);
    if(!d) return;
    let p = d.payments.find(x=>x.id===paymentId);
    if(!p) return;

    let tx = state.tx.find(t=>t.id===p.transactionId);
    if(!tx) {
        toast('Linked transaction not found. Aborting update.');
        alert('Error: The linked financial transaction for this payment could not be found. Update aborted to preserve integrity.');
        closeSheet(true);
        return;
    }

    let newAmount = +document.getElementById('edpa').value;
    let newDate = document.getElementById('edpdate').value;
    let newAccountId = document.getElementById('edpacc').value;
    let newNote = document.getElementById('edpnote').value.trim();

    if(!(newAmount > 0)) { toast('Enter a valid amount'); return; }
    let maxAllowed = d.remaining + p.amount;
    if(newAmount > maxAllowed + 0.005) { toast('Amount exceeds maximum allowed (' + money(maxAllowed) + ')'); return; }
    let newAcc = state.accounts.find(a=>a.id===newAccountId);
    if(!newAcc) { toast('Select a valid account'); return; }
    if(!newDate) { toast('Choose a valid date'); return; }

    newAmount = +newAmount.toFixed(2);

    let oldAcc = state.accounts.find(a=>a.id===p.accountId);
    if(oldAcc) {
        oldAcc.balance = +(oldAcc.balance + p.amount).toFixed(2);
    }
    newAcc.balance = +(newAcc.balance - newAmount).toFixed(2);

    tx.amount = newAmount;
    tx.date = newDate;
    tx.accountId = newAcc.id;
    tx.note = newNote;

    p.amount = newAmount;
    p.date = newDate;
    p.accountId = newAcc.id;
    p.note = newNote;

    d.paidAmount = +d.payments.reduce((sum,item)=>sum+item.amount,0).toFixed(2);
    d.remaining = +Math.max(0, d.original - d.paidAmount).toFixed(2);

    save();
    closeSheet(true);
    debtDetail(d.id);
    toast('Payment updated');
}

function deleteDebtPayment(debtId, paymentId){
    let d = state.debts.find(x=>x.id===debtId);
    if(!d) return;
    let p = d.payments.find(x=>x.id===paymentId);
    if(!p) return;

    let tx = state.tx.find(t=>t.id===p.transactionId);
    if(!tx) {
        toast('Linked transaction not found. Aborting deletion.');
        alert('Error: The linked financial transaction for this payment could not be found. Deletion aborted to preserve integrity.');
        return;
    }

    if(!confirm()) return;

    let acc = state.accounts.find(a=>a.id===p.accountId);
    if(acc) {
        acc.balance = +(acc.balance + p.amount).toFixed(2);
    }

    state.tx = state.tx.filter(t=>t.id!==p.transactionId);
    d.payments = d.payments.filter(x=>x.id!==paymentId);

    d.paidAmount = +d.payments.reduce((sum,item)=>sum+item.amount,0).toFixed(2);
    d.remaining = +Math.max(0, d.original - d.paidAmount).toFixed(2);

    save();
    debtDetail(d.id);
    toast('Payment deleted and account balance restored');
}
function deleteDebt(id){
    let d = state.debts.find(x=>x.id===id);
    if(!d) return;

    if(d.payments && d.payments.length > 0){
        toast('Cannot delete debt with payment history');
        alert(`Debt "${d.name}" has ${d.payments.length} payment record(s). Debts with payment history cannot be deleted to preserve financial integrity.`);
        return;
    }

    if(!confirm(`Delete debt "${d.name}"?`)) return;

    state.debts = state.debts.filter(x=>x.id!==id);
    save();
    debtPage();
    toast('Debt deleted');
}
function backupPayload(){return{app:'Personal CFO',backupVersion:2,createdAt:new Date().toISOString(),dataSummary:{accounts:state.accounts.length,transactions:state.tx.length,debts:state.debts.length,assets:state.assets.length,budgets:state.budgets.length,recurring:state.recurring.length,commitments:state.commitments.length},state:state}}
function backupAgeText(){let v=Number(localStorage.getItem('personal_cfo_last_backup')||0);if(!v)return '⚠️ No verified external backup recorded yet';let days=Math.floor((Date.now()-v)/86400000);if(days<=0)return '✅ Backup verified today';if(days===1)return '✅ Backup verified yesterday';if(days<=7)return '✅ Backup verified '+days+' days ago';return '⚠️ Backup is '+days+' days old — make a new backup'}
function downloadText(name,text,mime){let stamp=new Date().toISOString().replace(/[:.]/g,'-');let dot=name.lastIndexOf('.');let finalName=dot>0?name.slice(0,dot)+'_'+stamp+name.slice(dot):name+'_'+stamp;if(window.Android&&Android.saveTextFile){try{let b=btoa(unescape(encodeURIComponent(text)));Android.saveTextFile(finalName,mime,b);let folder=finalName.toLowerCase().includes('backup')?'Download/Personal_CFO/Backups':finalName.toLowerCase().includes('report')?'Download/Personal_CFO/Reports':'Download/Personal_CFO/Exports';toast('Saved to '+folder);return}catch(e){}}let blob=new Blob([text],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=finalName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(finalName+' downloaded')}
function openSettings(){openSheet(`<div class="handle"></div><h2>Settings</h2><div class="card"><div class="muted">Your financial data stays on this phone unless you export a backup.</div><div class="muted" style="margin-top:8px">🛡️ <b>Important:</b> a backup kept only inside the app can be removed when the app is uninstalled. Personal CFO now asks you to choose a user-visible location for every full backup.</div><div class="sectionTitle" style="margin-top:14px">Backup & restore</div><div id="backupStatus" class="muted" style="margin-bottom:10px">${backupAgeText()}</div><button class="btn block" onclick="backup()">💾 Create external backup</button><div style="margin-top:8px"><label class="btn secondary block" style="text-align:center;display:block">📥 Restore backup<input id="restoreInput" type="file" accept="application/json,.json" onchange="restore(this.files[0])" style="display:none"></label></div><div class="muted" style="margin-top:7px">Choose Downloads, Documents, your SD card, or a cloud provider such as Google Drive when Android shows the save location. Keep the file outside Personal CFO app storage.</div></div><div class="card" style="margin-top:10px"><div class="sectionTitle" style="margin-top:0">Exports</div><button class="btn secondary block" onclick="exportCSV()">📄 Export transactions CSV</button><div style="margin-top:8px"><button class="btn secondary block" onclick="exportReport()">📊 Export financial report</button></div></div><div class="card" style="margin-top:10px"><div class="sectionTitle" style="margin-top:0">Data controls</div><button class="btn danger block" onclick="wipe()">🗑️ Delete all data</button><div class="muted" style="margin-top:7px">This permanently resets the data stored by Personal CFO on this phone.</div></div></div>`)}
function backup(){let payload=backupPayload(),text=JSON.stringify(payload,null,2),stamp=new Date().toISOString().replace(/[:.]/g,'-'),name='Personal_CFO_Backup_'+stamp+'.json';if(window.Android&&Android.createBackupFile){try{let b=btoa(unescape(encodeURIComponent(text)));Android.createBackupFile(name,'application/json',b);toast('Choose a safe external location for the backup');return}catch(e){toast('Could not open backup save dialog')}}let blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);localStorage.setItem('personal_cfo_last_backup',String(Date.now()));toast(name+' downloaded')}
function onAndroidBackupResult(ok,msg){if(ok){localStorage.setItem('personal_cfo_last_backup',String(Date.now()));toast('✅ '+msg);let el=document.getElementById('backupStatus');if(el)el.textContent=backupAgeText()}else toast('⚠️ '+msg)}
function validateBackup(x){let s=x&&x.state?x.state:x;if(!s||!Array.isArray(s.accounts)||!Array.isArray(s.tx))return null;if(!Array.isArray(s.assets))s.assets=[];if(!Array.isArray(s.debts))s.debts=[];if(!Array.isArray(s.budgets))s.budgets=[];if(!Array.isArray(s.recurring))s.recurring=[];if(!Array.isArray(s.commitments))s.commitments=[];s.commitments.forEach(c=>{if(!Array.isArray(c.paymentIds))c.paymentIds=[];if(!Number.isFinite(+c.paidTotal))c.paidTotal=c.status==='settled'?(+c.amount||0):0});if(!s.safety||typeof s.safety!=='object')s.safety={reserve:0};delete s.goals;delete s.safety.goal;return s}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),s=validateBackup(x);if(!s)throw Error();if(!confirm('Restore this backup? Your current Personal CFO data will be replaced.'))return;state=s;save();closeSheet(true);toast('Backup restored successfully')}catch{toast('Invalid or unsupported backup file')}};r.readAsText(file)}
function csvCell(v){let s=String(v??'');return /[\",\n]/.test(s)?'\"'+s.replace(/\"/g,'\"\"')+'\"':s}
function exportCSV(){let rows=[['Date','Type','Amount','Category','Note','Account','From Account','To Account']];state.tx.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>{let a=state.accounts.find(x=>x.id===t.accountId),fa=state.accounts.find(x=>x.id===t.fromAccountId),ta=state.accounts.find(x=>x.id===t.toAccountId);rows.push([t.date,t.type,t.amount,t.category||'',t.note||'',a?a.name:'',fa?fa.name:'',ta?ta.name:''])});downloadText('personal-cfo-transactions.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
function exportReport(){let t=totals(),k=monthKey(date()),m=monthStats(k),st=budgetStats(k),safe=safeSpendStats(),f=recurringForecast(30);let lines=['PERSONAL CFO — FINANCIAL REPORT','Generated: '+new Date().toLocaleString('en-BD'),'','CURRENT POSITION','Liquid money: '+money(t.cash),'Assets: '+money(t.assets),'Debt: '+money(t.debt),'Net worth: '+money(t.net),'','THIS MONTH','Income: '+money(m.inc),'Expenses: '+money(m.exp),'Saved: '+money(m.saved),'Savings rate: '+(m.inc?((m.saved/m.inc)*100).toFixed(1)+'%':'N/A'),'','BUDGET','Budgeted: '+money(st.totalBudget),'Spent: '+money(st.totalSpent),'Remaining: '+money(st.remaining),'','SAFE TO SPEND','Safe to spend: '+money(safe.safe),'Emergency reserve: '+money(safe.reserve),'Remaining budgets: '+money(safe.budgetReserve),'','NEXT 30 DAYS','Expected income: '+money(f.income),'Expected expenses: '+money(f.expense),'Projected liquid: '+money(f.projected),'','TRANSACTIONS: '+state.tx.length];downloadText('personal-cfo-financial-report.txt',lines.join('\n'),'text/plain;charset=utf-8')}
function wipe(){if(confirm('Delete ALL Personal CFO data from this phone? This cannot be undone.')){state=blank();save();closeSheet(true);toast('All data deleted')}}
function openSheet(html){document.getElementById('sheetbox').innerHTML=html;document.getElementById('sheet').classList.add('open')}
function closeSheet(force=false){if(!force && window._formDirty && !confirm('Discard this entry?')) return false;document.getElementById('sheet').classList.remove('open');window._formDirty=false;window._editingId=null;return true}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2200)}
